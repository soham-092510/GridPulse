services:
  # ----------------------------------------------------
  # 1. FastAPI Intelligence Backend
  # ----------------------------------------------------
  - type: web
    name: neighbourflex-backend
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run_backend.py
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: API_V1_STR
        value: /api
      - key: ENVIRONMENT
        value: production

  # ----------------------------------------------------
  # 2. React Vite Frontend (Static Site)
  # ----------------------------------------------------
  - type: web
    name: neighbourflex-frontend
    runtime: static
    autoDeploy: true
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

